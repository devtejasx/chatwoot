tags:
  - Conversations
operationId: conversation-append-labels
summary: Append Labels
security:
  - userBearerAuth: []
  - agentBotBearerAuth: []
  - userApiKey: []
description: Add labels to a conversation and keep the labels it already has.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - labels
        properties:
          labels:
            type: array
            description: Labels to add to the conversation
            items:
              type: string
            example: ['support', 'billing']
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/conversation_labels'
  '404':
    description: Conversation not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
